<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russian Hyphenation</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #ffffff;
      }

      .panel {
        width: 100%;
        height: 100%;
        position: relative;
        background: #ffffff;
        overflow: hidden;
      }

      .layout-svg {
        width: 231.2px;
        height: 371.63px;
        left: 20px;
        top: 30px;
        position: absolute;
        display: block;
        user-select: none;
        pointer-events: none;
      }

      .primary {
        position: absolute;
        left: 20px;
        top: 270.79px;
        width: 231.2px;
        height: 51.8px;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .primary:disabled {
        cursor: default;
        opacity: 0.4;
      }

      .reset {
        position: absolute;
        left: 76px;
        top: 348px;
        width: 120px;
        height: 32px;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .reset:disabled {
        cursor: default;
        opacity: 0.4;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <svg class="layout-svg" viewBox="0 0 231.2 371.63" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="231.2" height="371.63" fill="#ffffff" />

        <g>
          <rect x="6.6" y="0" width="218" height="163" rx="4.8" fill="#F4F9F9" />
          <path fill="#F4F9F9" d="M29.37,23.34h16.18v16.18h-16.18v-16.18Z" />
          <path fill="#2D9CDB" d="M45.55,39.52v-7.12h179.05v-2.4H45.55v-6.66h-16.18v16.18h7.03v34.85l-14.79,5.65c-2.7,1.03-2.99,4.73-.49,6.18l15.28,8.81v68.11h2.4v-66.73l.51.3c.54.31.98.76,1.28,1.3l10.25,18.34c1.41,2.52,5.12,2.28,6.18-.41l20.25-51c1.1-2.78-1.62-5.54-4.41-4.47l-34.07,13.01v-33.94h6.75ZM31.77,37.12v-11.38h11.38v11.38h-11.38Z" />
          <g>
            <rect x="53.81" y="123.08" width="170.79" height="15.35" fill="#DCE8E8" />
            <path fill="#DCE8E8" d="M53.81,163.13h165.5c2.92,0,5.29-2.37,5.29-5.29v-10.07H53.81v15.35Z" />
            <polygon fill="#DCE8E8" points="62.8 113.73 224.6 113.73 224.6 98.38 68.9 98.38 62.8 113.73" />
            <polygon fill="#DCE8E8" points="72.61 89.04 224.6 89.04 224.6 73.68 78.7 73.68 72.61 89.04" />
            <path fill="#DCE8E8" d="M53.81,48.99v13.86l17.43-6.65c5.73-2.19,11.34,2.56,10.81,8.15h142.54v-15.35H53.81Z" />
          </g>
        </g>

        <text x="115.6" y="183" text-anchor="middle" fill="#333333" opacity="0.8" font-size="11" font-family="Inter, sans-serif">
          <tspan x="115.6" dy="0">Для работы выделите текстовый блок</tspan>
          <tspan x="115.6" dy="13.2">в Figma, затем нажмите нужную</tspan>
          <tspan x="115.6" dy="13.2">кнопку.</tspan>
        </text>

        <rect x="0" y="240.79" width="231.2" height="51.8" rx="4.8" fill="#333333" />
        <text x="115.6" y="271.5" text-anchor="middle" fill="#ffffff" font-size="14.4" font-family="Inter, sans-serif" letter-spacing="0.58">Применить переносы</text>
        <text x="115.6" y="333" text-anchor="middle" fill="#2D9CDB" font-size="14.4" font-family="Inter, sans-serif" letter-spacing="0.58">Сбросить</text>
        <text x="115.6" y="369" text-anchor="middle" fill="#BDBDBD" font-size="11" font-family="Inter, sans-serif" letter-spacing="0.44">by Eugeny Leshchenko</text>
      </svg>
      <button class="primary" id="apply-button" aria-label="Применить переносы"></button>
      <button class="reset" id="reset-button" aria-label="Сбросить"></button>
      <div class="sr-only" id="status" aria-live="polite"></div>
    </main>

    <script>
      const applyButton = document.getElementById("apply-button");
      const resetButton = document.getElementById("reset-button");
      const statusNode = document.getElementById("status");

      function send(type) {
        parent.postMessage({ pluginMessage: { type } }, "*");
      }

      function setLoading(isLoading) {
        applyButton.disabled = isLoading;
        resetButton.disabled = isLoading;
      }

      function updateStatus(message, kind) {
        statusNode.textContent = message || "";
        statusNode.setAttribute("data-kind", kind || "");
      }

      applyButton.addEventListener("click", () => send("apply"));
      resetButton.addEventListener("click", () => send("reset"));

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message || typeof message !== "object") {
          return;
        }

        if (message.type === "loading") {
          setLoading(Boolean(message.isLoading));
        }

        if (message.type === "status") {
          updateStatus(message.message, message.kind);
        }
      };
    </script>
  </body>
</html>
