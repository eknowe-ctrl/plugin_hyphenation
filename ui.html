<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russian Hyphenation</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #f7f8fb;
        color: #1f2937;
      }

      .panel {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid #e5e7eb;
        background: #ffffff;
      }

      .title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      .subtitle {
        margin: 6px 0 0;
        font-size: 11px;
        color: #6b7280;
      }

      .content {
        flex: 1;
        overflow: auto;
        padding: 12px 16px 10px;
      }

      .footer {
        padding: 8px 16px 12px;
        font-size: 11px;
        color: #9ca3af;
        text-align: center;
        border-top: 1px solid #e5e7eb;
        background: #ffffff;
      }

      .section {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
      }

      .section h3 {
        margin: 0 0 8px;
        font-size: 12px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 6px 0;
        font-size: 11px;
      }

      .row label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      select,
      input[type="number"] {
        width: 112px;
        height: 28px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 4px 8px;
        background: #ffffff;
        font-size: 11px;
      }

      input[type="checkbox"] {
        width: 14px;
        height: 14px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }

      .actions button {
        height: 32px;
        border: 1px solid transparent;
        border-radius: 6px;
        font-size: 11px;
        cursor: pointer;
      }

      #apply-button {
        background: #111827;
        color: #ffffff;
      }

      #reset-button {
        border-color: #9ca3af;
        background: #ffffff;
        color: #111827;
      }

      #close-button {
        border-color: #d1d5db;
        background: #f9fafb;
        color: #374151;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .status {
        margin-top: 8px;
        font-size: 11px;
        line-height: 1.35;
        color: #374151;
        min-height: 30px;
      }

      .status[data-kind="error"] {
        color: #b91c1c;
      }

      .status[data-kind="success"] {
        color: #065f46;
      }

      .debug-list {
        margin: 0;
        padding-left: 16px;
        font-size: 10.5px;
        line-height: 1.35;
        max-height: 170px;
        overflow: auto;
      }

      .debug-meta {
        font-size: 10.5px;
        color: #4b5563;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1 class="title">Russian Hyphenation</h1>
        <p class="subtitle">Настройки сохраняются между запусками плагина</p>
      </header>

      <div class="content">
        <section class="section">
          <h3>Профиль типографики</h3>
          <div class="row">
            <span>Preset</span>
            <select id="preset">
              <option value="interface">Interface</option>
              <option value="book">Book</option>
              <option value="dense">Dense</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div class="row">
            <label><input type="checkbox" id="autoWatch" /> Автопересчёт при изменении ширины</label>
          </div>
          <div class="row">
            <label><input type="checkbox" id="preventOrphans" /> Анти-висячие предлоги</label>
          </div>
          <div class="row">
            <label><input type="checkbox" id="hangingHyphen" /> Висячий дефис</label>
          </div>
          <div class="row">
            <label><input type="checkbox" id="optimizeLetterSpacing" /> Оптимизация letter spacing</label>
          </div>
          <div class="row">
            <label><input type="checkbox" id="experimentalWordSpacingEnabled" /> Experimental: размер пробелов</label>
            <input id="wsPercent" type="number" min="85" max="135" step="1" />
          </div>
        </section>

        <section class="section">
          <h3>Letter spacing (%)</h3>
          <div class="row">
            <span>Minimum</span>
            <input id="lsMin" type="number" step="0.1" />
          </div>
          <div class="row">
            <span>Desired</span>
            <input id="lsDesired" type="number" step="0.1" />
          </div>
          <div class="row">
            <span>Maximum</span>
            <input id="lsMax" type="number" step="0.1" />
          </div>
          <div class="row">
            <span>Step</span>
            <input id="lsStep" type="number" min="0.1" step="0.1" />
          </div>
        </section>

        <section class="section">
          <h3>Отладка пропусков</h3>
          <div class="debug-meta" id="debug-meta">Нет данных</div>
          <ul class="debug-list" id="debug-list"></ul>
        </section>

        <section class="section">
          <div class="actions">
            <button id="apply-button">Применить</button>
            <button id="reset-button">Сбросить</button>
            <button id="close-button">Закрыть</button>
          </div>
          <div class="status" id="status" aria-live="polite"></div>
        </section>
      </div>
      <footer class="footer">by Eugeny Leshchenko</footer>
    </main>

    <script>
      const applyButton = document.getElementById("apply-button");
      const resetButton = document.getElementById("reset-button");
      const closeButton = document.getElementById("close-button");
      const presetSelect = document.getElementById("preset");
      const statusNode = document.getElementById("status");
      const debugMeta = document.getElementById("debug-meta");
      const debugList = document.getElementById("debug-list");

      const fields = {
        autoWatch: document.getElementById("autoWatch"),
        preventOrphans: document.getElementById("preventOrphans"),
        hangingHyphen: document.getElementById("hangingHyphen"),
        optimizeLetterSpacing: document.getElementById("optimizeLetterSpacing"),
        experimentalWordSpacingEnabled: document.getElementById("experimentalWordSpacingEnabled"),
        experimentalWordSpacingPercent: document.getElementById("wsPercent"),
        letterSpacingMinPercent: document.getElementById("lsMin"),
        letterSpacingDesiredPercent: document.getElementById("lsDesired"),
        letterSpacingMaxPercent: document.getElementById("lsMax"),
        letterSpacingStepPercent: document.getElementById("lsStep")
      };

      function send(type, payload = {}) {
        parent.postMessage({ pluginMessage: { type, ...payload } }, "*");
      }

      function setLoading(isLoading) {
        applyButton.disabled = isLoading;
        resetButton.disabled = isLoading;
      }

      function updateStatus(message, kind) {
        statusNode.textContent = message || "";
        statusNode.setAttribute("data-kind", kind || "");
      }

      function setNumeric(input, value) {
        input.value = Number.isFinite(value) ? String(value) : "0";
      }

      function renderSettings(settings) {
        if (!settings) {
          return;
        }
        presetSelect.value = settings.preset || "custom";
        fields.autoWatch.checked = Boolean(settings.autoWatch);
        fields.preventOrphans.checked = Boolean(settings.preventOrphans);
        fields.hangingHyphen.checked = Boolean(settings.hangingHyphen);
        fields.optimizeLetterSpacing.checked = Boolean(settings.optimizeLetterSpacing);
        fields.experimentalWordSpacingEnabled.checked = Boolean(
          settings.experimentalWordSpacingEnabled
        );
        setNumeric(
          fields.experimentalWordSpacingPercent,
          Number(settings.experimentalWordSpacingPercent)
        );
        setNumeric(fields.letterSpacingMinPercent, Number(settings.letterSpacingMinPercent));
        setNumeric(fields.letterSpacingDesiredPercent, Number(settings.letterSpacingDesiredPercent));
        setNumeric(fields.letterSpacingMaxPercent, Number(settings.letterSpacingMaxPercent));
        setNumeric(fields.letterSpacingStepPercent, Number(settings.letterSpacingStepPercent));
      }

      function collectManualSettings() {
        return {
          autoWatch: fields.autoWatch.checked,
          preventOrphans: fields.preventOrphans.checked,
          hangingHyphen: fields.hangingHyphen.checked,
          optimizeLetterSpacing: fields.optimizeLetterSpacing.checked,
          experimentalWordSpacingEnabled: fields.experimentalWordSpacingEnabled.checked,
          experimentalWordSpacingPercent: Number(fields.experimentalWordSpacingPercent.value),
          letterSpacingMinPercent: Number(fields.letterSpacingMinPercent.value),
          letterSpacingDesiredPercent: Number(fields.letterSpacingDesiredPercent.value),
          letterSpacingMaxPercent: Number(fields.letterSpacingMaxPercent.value),
          letterSpacingStepPercent: Number(fields.letterSpacingStepPercent.value)
        };
      }

      function renderDebug(debug) {
        if (!debug) {
          debugMeta.textContent = "Нет данных";
          debugList.innerHTML = "";
          return;
        }

        debugMeta.textContent = `mode: ${debug.mode}, changed: ${debug.changedNodes}/${debug.totalNodes}, skipped: ${debug.skippedNodes}`;
        debugList.innerHTML = "";

        if (!Array.isArray(debug.skippedReasons) || debug.skippedReasons.length === 0) {
          return;
        }

        for (const item of debug.skippedReasons) {
          const li = document.createElement("li");
          const name = item.nodeName || item.nodeId || "unknown";
          li.textContent = `${name}: ${item.reason}`;
          debugList.appendChild(li);
        }
      }

      applyButton.addEventListener("click", () => send("apply"));
      resetButton.addEventListener("click", () => send("reset"));
      closeButton.addEventListener("click", () => send("close"));

      presetSelect.addEventListener("change", () => {
        if (presetSelect.value === "custom") {
          return;
        }
        send("select-preset", { preset: presetSelect.value });
      });

      Object.values(fields).forEach((node) => {
        node.addEventListener("change", () => {
          send("save-settings", {
            settings: collectManualSettings()
          });
        });
      });

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message || typeof message !== "object") {
          return;
        }

        if (message.type === "loading") {
          setLoading(Boolean(message.isLoading));
        }

        if (message.type === "status") {
          updateStatus(message.message, message.kind);
        }

        if (message.type === "settings") {
          renderSettings(message.settings);
        }

        if (message.type === "debug") {
          renderDebug(message.debug);
        }
      };

      send("request-settings");
    </script>
  </body>
</html>
