<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russian Hyphenation</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #ffffff;
      }

      .panel {
        width: 100%;
        height: 100%;
        position: relative;
        background: #ffffff;
        overflow: hidden;
      }

      .layout-svg {
        width: 231.2px;
        height: 371.63px;
        left: 0;
        top: 0;
        position: absolute;
        display: block;
        user-select: none;
        pointer-events: none;
      }

      .primary {
        position: absolute;
        left: 0;
        top: 240.79px;
        width: 231.2px;
        height: 51.8px;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .primary:disabled {
        cursor: default;
        opacity: 0.4;
      }

      .reset {
        position: absolute;
        left: 56px;
        top: 318px;
        width: 120px;
        height: 32px;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .reset:disabled {
        cursor: default;
        opacity: 0.4;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <img class="layout-svg" src="assets/ui-layout.svg" alt="" aria-hidden="true" />
      <button class="primary" id="apply-button" aria-label="Применить переносы"></button>
      <button class="reset" id="reset-button" aria-label="Сбросить"></button>
      <div class="sr-only" id="status" aria-live="polite"></div>
    </main>

    <script>
      const applyButton = document.getElementById("apply-button");
      const resetButton = document.getElementById("reset-button");
      const statusNode = document.getElementById("status");

      function send(type) {
        parent.postMessage({ pluginMessage: { type } }, "*");
      }

      function setLoading(isLoading) {
        applyButton.disabled = isLoading;
        resetButton.disabled = isLoading;
      }

      function updateStatus(message, kind) {
        statusNode.textContent = message || "";
        statusNode.setAttribute("data-kind", kind || "");
      }

      applyButton.addEventListener("click", () => send("apply"));
      resetButton.addEventListener("click", () => send("reset"));

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message || typeof message !== "object") {
          return;
        }

        if (message.type === "loading") {
          setLoading(Boolean(message.isLoading));
        }

        if (message.type === "status") {
          updateStatus(message.message, message.kind);
        }
      };
    </script>
  </body>
</html>
