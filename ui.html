<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russian Hyphenation</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Inter, sans-serif;
      }

      .panel {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 18px 12px;
        background: #ffffff;
        overflow: hidden;
        display: inline-flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 29px;
      }

      .close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 24px;
        height: 24px;
        border: none;
        background: transparent;
        color: #a6a6a6;
        font-size: 18px;
        font-weight: 400;
        line-height: 1;
        padding: 0;
        cursor: pointer;
      }

      .close:hover {
        color: #8a8a8a;
      }

      .hero {
        position: absolute;
        width: 218.4px;
        height: 193.8px;
        left: 40.8px;
        top: 40px;
        background: #f4f9f9;
        border-radius: 4.8px;
        overflow: hidden;
      }

      .hero-inner {
        position: absolute;
        width: 218.4px;
        height: 193.8px;
        left: 0;
        top: 0;
        background: #f4f9f9;
        border-radius: 4.8px;
        overflow: hidden;
      }

      .shape-frame {
        position: absolute;
        width: 233.07px;
        height: 233.07px;
        left: 30px;
        top: 30px;
        border: 2.4px #2d9cdb solid;
      }

      .shape-square {
        position: absolute;
        width: 16.18px;
        height: 16.18px;
        left: 22.97px;
        top: 23.34px;
        background: #f4f9f9;
        border: 2.4px #2d9cdb solid;
      }

      .shape-line {
        position: absolute;
        width: 198.24px;
        height: 15.35px;
        left: 47.41px;
        background: #dce8e8;
      }

      .shape-line-1 {
        top: 48.99px;
      }

      .shape-line-2 {
        top: 73.68px;
      }

      .shape-line-3 {
        top: 98.38px;
      }

      .shape-line-4 {
        top: 123.08px;
      }

      .shape-line-5 {
        top: 147.77px;
      }

      .shape-line-6 {
        top: 172.47px;
      }

      .shape-fade {
        position: absolute;
        width: 218.4px;
        height: 193.8px;
        left: 0;
        top: 0;
        background: linear-gradient(180deg, rgba(244, 249, 249, 0) 37%, #ffffff 74%);
      }

      .shape-cursor {
        position: absolute;
        width: 51.03px;
        height: 57.1px;
        left: 52.21px;
        top: 43.09px;
        transform: rotate(45deg);
        transform-origin: top left;
        background: #2d9cdb;
        border-radius: 9.12px;
        outline: 4.56px #f4f9f9 solid;
      }

      .note {
        position: absolute;
        width: 186.64px;
        height: 39.79px;
        left: 15.88px;
        top: 148.71px;
        opacity: 0.8;
        text-align: center;
        color: #333333;
        font-size: 11px;
        font-weight: 400;
        line-height: 13.2px;
        letter-spacing: 0;
      }

      .primary {
        padding: 17.4px 33.6px;
        background: #333333;
        overflow: hidden;
        border-radius: 4.8px;
        justify-content: center;
        align-items: center;
        gap: 6px;
        display: inline-flex;
        border: none;
        color: #ffffff;
        font-size: 14.4px;
        font-weight: 400;
        letter-spacing: 0.58px;
        line-height: 14.4px;
        white-space: nowrap;
        cursor: pointer;
      }

      .primary:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .reset {
        padding: 0;
        border: none;
        background: transparent;
        color: #2d9cdb;
        font-size: 14.4px;
        font-weight: 400;
        letter-spacing: 0.58px;
        line-height: 14.4px;
        text-align: center;
        cursor: pointer;
      }

      .reset:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .author {
        text-align: center;
        color: #bdbdbd;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.44px;
        line-height: 11px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <button class="close" id="close-button" aria-label="Закрыть плагин">×</button>

      <div class="hero" aria-hidden="true">
        <div class="hero-inner">
          <div class="shape-frame"></div>
          <div class="shape-square"></div>
          <div class="shape-line shape-line-1"></div>
          <div class="shape-line shape-line-2"></div>
          <div class="shape-line shape-line-3"></div>
          <div class="shape-line shape-line-4"></div>
          <div class="shape-line shape-line-5"></div>
          <div class="shape-line shape-line-6"></div>
          <div class="shape-fade"></div>
          <div class="shape-cursor"></div>
        </div>
        <div class="note">Для работы выделите текстовый блок в Figma, затем нажмите нужную кнопку.</div>
      </div>

      <button class="primary" id="apply-button">Применить переносы</button>
      <button class="reset" id="reset-button">Сбросить</button>
      <div class="author">by Eugeny Leshchenko</div>
      <div class="sr-only" id="status" aria-live="polite"></div>
    </main>

    <script>
      const applyButton = document.getElementById("apply-button");
      const resetButton = document.getElementById("reset-button");
      const closeButton = document.getElementById("close-button");
      const statusNode = document.getElementById("status");

      function send(type) {
        parent.postMessage({ pluginMessage: { type } }, "*");
      }

      function setLoading(isLoading) {
        applyButton.disabled = isLoading;
        resetButton.disabled = isLoading;
      }

      function updateStatus(message, kind) {
        statusNode.textContent = message || "";
        statusNode.setAttribute("data-kind", kind || "");
      }

      applyButton.addEventListener("click", () => send("apply"));
      resetButton.addEventListener("click", () => send("reset"));
      closeButton.addEventListener("click", () => send("close"));

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message || typeof message !== "object") {
          return;
        }

        if (message.type === "loading") {
          setLoading(Boolean(message.isLoading));
        }

        if (message.type === "status") {
          updateStatus(message.message, message.kind);
        }
      };
    </script>
  </body>
</html>
