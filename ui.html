<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russian Hyphenation</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #ffffff;
      }

      .panel {
        width: 100%;
        height: 100%;
        position: relative;
        background: #ffffff;
        overflow: hidden;
      }

      .layout-svg {
        width: 231.2px;
        height: 371.63px;
        left: 0;
        top: 0;
        position: absolute;
        display: block;
        user-select: none;
        pointer-events: none;
      }

      .primary {
        position: absolute;
        left: 0;
        top: 240.79px;
        width: 231.2px;
        height: 51.8px;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .primary:disabled {
        cursor: default;
        opacity: 0.4;
      }

      .reset {
        position: absolute;
        left: 56px;
        top: 318px;
        width: 120px;
        height: 32px;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .reset:disabled {
        cursor: default;
        opacity: 0.4;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <svg class="layout-svg" viewBox="0 0 231.2 371.63" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="231.2" height="371.63" fill="#ffffff" />

        <defs>
          <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="37%" stop-color="#F4F9F9" stop-opacity="0" />
            <stop offset="74%" stop-color="#ffffff" />
          </linearGradient>
        </defs>

        <g transform="translate(6.6,0)">
          <rect x="0" y="0" width="218" height="163" rx="4.8" fill="#F4F9F9" />
          <path d="M22.77 23.34H39.15V39.72H22.77V23.34Z" fill="#F4F9F9" />
          <rect x="22.77" y="23.34" width="16.38" height="16.38" fill="none" stroke="#2D9CDB" stroke-width="2.4" />
          <path d="M39.15 31.2H218" stroke="#2D9CDB" stroke-width="2.4" />
          <path d="M31.2 30V116" stroke="#2D9CDB" stroke-width="2.4" />
          <rect x="53.81" y="48.99" width="164.19" height="15.35" fill="#DCE8E8" />
          <rect x="53.81" y="73.68" width="164.19" height="15.35" fill="#DCE8E8" />
          <rect x="53.81" y="98.38" width="164.19" height="15.35" fill="#DCE8E8" />
          <rect x="53.81" y="123.08" width="164.19" height="15.35" fill="#DCE8E8" />
          <rect x="53.81" y="147.77" width="164.19" height="15.35" fill="#DCE8E8" />
          <rect x="0" y="0" width="218" height="163" fill="url(#heroFade)" />
          <path fill="#ffffff" d="M64.84,56.19c6.5-2.48,12.84,3.95,10.27,10.41l-20.25,51c-2.48,6.25-11.11,6.82-14.4.95l-10.1-18.06-17.93-10.34c-5.83-3.36-5.14-11.98,1.14-14.38l51.26-19.57Z" />
          <path fill="#2D9CDB" d="M14.72,86.2c-2.5-1.44-2.21-5.15.49-6.18l51.26-19.57c2.79-1.07,5.51,1.7,4.41,4.47l-20.25,51c-1.07,2.69-4.77,2.93-6.18.41l-10.25-18.34c-.3-.54-.74-.99-1.28-1.3l-18.2-10.49Z" />
        </g>

        <text x="115.6" y="183" text-anchor="middle" fill="#333333" opacity="0.8" font-size="11" font-family="Inter, sans-serif">
          <tspan x="115.6" dy="0">Для работы выделите текстовый блок</tspan>
          <tspan x="115.6" dy="13.2">в Figma, затем нажмите нужную</tspan>
          <tspan x="115.6" dy="13.2">кнопку.</tspan>
        </text>

        <rect x="0" y="240.79" width="231.2" height="51.8" rx="4.8" fill="#333333" />
        <text x="115.6" y="271.5" text-anchor="middle" fill="#ffffff" font-size="14.4" font-family="Inter, sans-serif" letter-spacing="0.58">Применить переносы</text>
        <text x="115.6" y="333" text-anchor="middle" fill="#2D9CDB" font-size="14.4" font-family="Inter, sans-serif" letter-spacing="0.58">Сбросить</text>
        <text x="115.6" y="369" text-anchor="middle" fill="#BDBDBD" font-size="11" font-family="Inter, sans-serif" letter-spacing="0.44">by Eugeny Leshchenko</text>
      </svg>
      <button class="primary" id="apply-button" aria-label="Применить переносы"></button>
      <button class="reset" id="reset-button" aria-label="Сбросить"></button>
      <div class="sr-only" id="status" aria-live="polite"></div>
    </main>

    <script>
      const applyButton = document.getElementById("apply-button");
      const resetButton = document.getElementById("reset-button");
      const statusNode = document.getElementById("status");

      function send(type) {
        parent.postMessage({ pluginMessage: { type } }, "*");
      }

      function setLoading(isLoading) {
        applyButton.disabled = isLoading;
        resetButton.disabled = isLoading;
      }

      function updateStatus(message, kind) {
        statusNode.textContent = message || "";
        statusNode.setAttribute("data-kind", kind || "");
      }

      applyButton.addEventListener("click", () => send("apply"));
      resetButton.addEventListener("click", () => send("reset"));

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message || typeof message !== "object") {
          return;
        }

        if (message.type === "loading") {
          setLoading(Boolean(message.isLoading));
        }

        if (message.type === "status") {
          updateStatus(message.message, message.kind);
        }
      };
    </script>
  </body>
</html>
