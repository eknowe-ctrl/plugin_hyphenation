<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russian Hyphenation</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: white;
        font-family: "SF Pro", "SF Pro Text", "SF Pro Display", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      }

      .panel {
        width: 100%;
        height: 100%;
        padding-left: 12px;
        padding-right: 12px;
        padding-top: 18px;
        padding-bottom: 18px;
        position: relative;
        background: white;
        overflow: hidden;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 29px;
        display: inline-flex;
      }

      .hero {
        width: 218px;
        height: 148px;
        position: relative;
        background: #f4f9f9;
        overflow: hidden;
        border-radius: 4.8px;
      }

      .hero-img {
        width: 218.67px;
        height: 148px;
        left: -0.33px;
        top: 0;
        position: absolute;
        object-fit: cover;
      }

      .note {
        width: 186.64px;
        height: 39.79px;
        opacity: 0.8;
        text-align: center;
        color: #333333;
        font-size: 11px;
        font-weight: 400;
        line-height: 13.2px;
        font-family: "SF Pro", "SF Pro Text", "SF Pro Display", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        word-wrap: break-word;
      }

      .primary {
        padding-left: 33.6px;
        padding-right: 33.6px;
        padding-top: 17.4px;
        padding-bottom: 17.4px;
        background: #333333;
        overflow: hidden;
        border-radius: 4.8px;
        justify-content: center;
        align-items: center;
        gap: 6px;
        display: inline-flex;
        border: none;
        text-align: center;
        color: white;
        font-size: 14.4px;
        font-family: "SF Pro", "SF Pro Text", "SF Pro Display", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        font-weight: 400;
        letter-spacing: 0.58px;
        word-wrap: break-word;
        cursor: pointer;
      }

      .primary:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .reset {
        border: none;
        background: transparent;
        text-align: center;
        color: #2d9cdb;
        font-size: 14.4px;
        font-family: "SF Pro", "SF Pro Text", "SF Pro Display", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        font-weight: 400;
        letter-spacing: 0.58px;
        word-wrap: break-word;
        cursor: pointer;
      }

      .reset:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .author {
        text-align: center;
        color: #bdbdbd;
        font-size: 11px;
        font-family: "SF Pro", "SF Pro Text", "SF Pro Display", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        font-weight: 400;
        letter-spacing: 0.44px;
        word-wrap: break-word;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="hero" aria-hidden="true">
        <img class="hero-img" src="assets/hero.png" alt="" />
      </div>

      <div class="note">Для работы выделите текстовый блок в Figma, затем нажмите нужную кнопку.</div>
      <button class="primary" id="apply-button">Применить переносы</button>
      <button class="reset" id="reset-button">Сбросить</button>
      <div class="author">by Eugeny Leshchenko</div>
      <div class="sr-only" id="status" aria-live="polite"></div>
    </main>

    <script>
      const applyButton = document.getElementById("apply-button");
      const resetButton = document.getElementById("reset-button");
      const statusNode = document.getElementById("status");

      function send(type) {
        parent.postMessage({ pluginMessage: { type } }, "*");
      }

      function setLoading(isLoading) {
        applyButton.disabled = isLoading;
        resetButton.disabled = isLoading;
      }

      function updateStatus(message, kind) {
        statusNode.textContent = message || "";
        statusNode.setAttribute("data-kind", kind || "");
      }

      applyButton.addEventListener("click", () => send("apply"));
      resetButton.addEventListener("click", () => send("reset"));

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message || typeof message !== "object") {
          return;
        }

        if (message.type === "loading") {
          setLoading(Boolean(message.isLoading));
        }

        if (message.type === "status") {
          updateStatus(message.message, message.kind);
        }
      };
    </script>
  </body>
</html>
