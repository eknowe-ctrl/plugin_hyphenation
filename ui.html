<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russian Hyphenation</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .panel {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 14px 0 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #ececec;
        border-radius: 16px;
        overflow: hidden;
      }

      .close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 36px;
        height: 36px;
        border: none;
        background: transparent;
        color: #7f7f7f;
        font-size: 22px;
        font-weight: 300;
        line-height: 1;
        cursor: pointer;
      }

      .close:hover {
        color: #5f5f5f;
      }

      .illustration {
        margin-top: 28px;
        width: 220px;
        height: 130px;
      }

      .note {
        margin: 22px 0 0;
        width: 220px;
        text-align: center;
        color: #6d6d6d;
        font-size: 12px;
        line-height: 1.35;
        letter-spacing: 0.2px;
        white-space: pre-line;
      }

      .primary {
        margin-top: 4px;
        width: 232px;
        height: 50px;
        border: none;
        border-radius: 5px;
        background: #2f2f31;
        color: #f2f2f2;
        font-size: 16px;
        line-height: 1;
        letter-spacing: 0.4px;
        cursor: pointer;
      }

      .primary:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .reset {
        margin-top: 3px;
        border: none;
        background: transparent;
        color: #2499ed;
        font-size: 16px;
        line-height: 1;
        letter-spacing: 0.2px;
        cursor: pointer;
      }

      .reset:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .author {
        margin-top: auto;
        margin-bottom: 2px;
        color: #b0b0b0;
        font-size: 14px;
        letter-spacing: 0.2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <button class="close" id="close-button" aria-label="Закрыть плагин">✕</button>

      <svg
        class="illustration"
        viewBox="0 0 220 130"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <rect x="16" y="8" width="188" height="84" rx="4" fill="#E2E8EB" />
        <rect x="16" y="34" width="188" height="9" fill="#D4DEE3" />
        <rect x="46" y="49" width="158" height="9" fill="#D4DEE3" />
        <rect x="46" y="64" width="158" height="9" fill="#D4DEE3" />
        <rect x="46" y="79" width="158" height="9" fill="#D4DEE3" />
        <path d="M46 31H205" stroke="#38A0E0" stroke-width="3" />
        <path d="M46 31V59" stroke="#38A0E0" stroke-width="3" />
        <rect x="39" y="23" width="14" height="14" fill="#ECECEC" stroke="#38A0E0" stroke-width="3" />
        <g transform="translate(0 0)">
          <path
            d="M31 87L55 102C57 103 60 102 61 99L83 58C84 55 81 52 78 53L26 73C22 74 21 80 24 82L31 87Z"
            fill="#38A0E0"
          />
          <path
            d="M31 87L52 74"
            stroke="#ECECEC"
            stroke-width="2"
            stroke-linecap="round"
          />
        </g>
      </svg>

      <p class="note">Для работы выделите текстовый
блок в Figma, затем нажмите
нужную кнопку.</p>

      <button class="primary" id="apply-button">Применить переносы</button>
      <button class="reset" id="reset-button">Сбросить</button>
      <div class="author">by Eugeny Leshchenko</div>
      <div class="sr-only" id="status" aria-live="polite"></div>
    </main>

    <script>
      const applyButton = document.getElementById("apply-button");
      const resetButton = document.getElementById("reset-button");
      const closeButton = document.getElementById("close-button");
      const statusNode = document.getElementById("status");

      function send(type) {
        parent.postMessage({ pluginMessage: { type } }, "*");
      }

      function setLoading(isLoading) {
        applyButton.disabled = isLoading;
        resetButton.disabled = isLoading;
      }

      function updateStatus(message, kind) {
        statusNode.textContent = message || "";
        statusNode.setAttribute("data-kind", kind || "");
      }

      applyButton.addEventListener("click", () => send("apply"));
      resetButton.addEventListener("click", () => send("reset"));
      closeButton.addEventListener("click", () => send("close"));

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message || typeof message !== "object") {
          return;
        }

        if (message.type === "loading") {
          setLoading(Boolean(message.isLoading));
        }

        if (message.type === "status") {
          updateStatus(message.message, message.kind);
        }
      };
    </script>
  </body>
</html>
