<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russian Hyphenation</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Inter, sans-serif;
      }

      .panel {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 18px 12px;
        background: #ffffff;
        overflow: hidden;
        display: inline-flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 29px;
      }

      .hero {
        position: relative;
        width: 218.4px;
        height: 193.8px;
        background: #f4f9f9;
        border-radius: 4.8px;
        overflow: hidden;
      }

      .hero-svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .note {
        position: absolute;
        width: 186.64px;
        height: 39.79px;
        left: 15.88px;
        top: 148.71px;
        opacity: 0.8;
        text-align: center;
        color: #333333;
        font-size: 11px;
        font-weight: 400;
        line-height: 13.2px;
        letter-spacing: 0;
        word-wrap: break-word;
        pointer-events: none;
      }

      .primary {
        padding: 17.4px 33.6px;
        background: #333333;
        overflow: hidden;
        border-radius: 4.8px;
        justify-content: center;
        align-items: center;
        gap: 6px;
        display: inline-flex;
        border: none;
        color: #ffffff;
        font-size: 14.4px;
        font-weight: 400;
        letter-spacing: 0.58px;
        line-height: 14.4px;
        white-space: nowrap;
        word-wrap: break-word;
        cursor: pointer;
      }

      .primary:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .reset {
        padding: 0;
        border: none;
        background: transparent;
        color: #2d9cdb;
        font-size: 14.4px;
        font-weight: 400;
        letter-spacing: 0.58px;
        line-height: 14.4px;
        text-align: center;
        word-wrap: break-word;
        cursor: pointer;
      }

      .reset:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .author {
        text-align: center;
        color: #bdbdbd;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.44px;
        line-height: 11px;
        word-wrap: break-word;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="hero" aria-hidden="true">
        <svg class="hero-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 263.07 263.07" fill="none">
          <defs>
            <clipPath id="hero-clip-main">
              <rect width="218.4" height="193.8" rx="4.8" ry="4.8" />
            </clipPath>
            <clipPath id="hero-clip-inner">
              <rect width="218.4" height="193.8" rx="4.8" ry="4.8" />
            </clipPath>
            <linearGradient id="hero-linear-gradient" x1="109.2" y1="195.28" x2="109.2" y2="1.48" gradientTransform="translate(0 195.28) scale(1 -1)" gradientUnits="userSpaceOnUse">
              <stop offset=".37" stop-color="#f4f9f9" stop-opacity="0" />
              <stop offset=".74" stop-color="#fff" />
            </linearGradient>
          </defs>
          <g clip-path="url(#hero-clip-main)">
            <g>
              <rect width="218.4" height="193.8" rx="4.8" ry="4.8" fill="#f4f9f9" />
              <g clip-path="url(#hero-clip-inner)">
                <g>
                  <rect width="218.4" height="193.8" rx="4.8" ry="4.8" fill="#f4f9f9" />
                  <path fill="#2d9cdb" d="M263.07,30v233.07H30V30h233.07ZM32.4,260.67h228.27V32.4H32.4v228.27Z" />
                  <path fill="#f4f9f9" d="M22.97,23.34h16.18v16.18h-16.18v-16.18Z" />
                  <path fill="#2d9cdb" d="M39.15,23.34v16.18h-16.18v-16.18h16.18ZM25.38,37.12h11.38v-11.38h-11.38v11.38Z" />
                  <rect x="47.41" y="48.99" width="198.24" height="15.35" fill="#dce8e8" />
                  <rect x="47.41" y="73.68" width="198.24" height="15.35" fill="#dce8e8" />
                  <rect x="47.41" y="98.38" width="198.24" height="15.35" fill="#dce8e8" />
                  <rect x="47.41" y="123.08" width="198.24" height="15.35" fill="#dce8e8" />
                  <rect x="47.41" y="147.77" width="198.24" height="15.35" fill="#dce8e8" />
                  <rect x="47.41" y="172.47" width="198.24" height="15.35" fill="#dce8e8" />
                  <rect width="218.4" height="193.8" fill="url(#hero-linear-gradient)" />
                  <path fill="#fff" d="M64.84,56.19c6.5-2.48,12.84,3.95,10.27,10.41l-20.25,51c-2.48,6.25-11.11,6.82-14.4.95l-10.1-18.06-17.93-10.34c-5.83-3.36-5.14-11.98,1.14-14.38l51.26-19.57ZM70.88,64.92c1.1-2.78-1.62-5.54-4.41-4.47l-51.26,19.57c-2.7,1.03-2.99,4.73-.49,6.18l18.2,10.5c.54.31.98.76,1.28,1.3l10.25,18.34c1.37,2.44,4.89,2.29,6.08-.16l.11-.25,20.25-51Z" />
                  <path fill="#2d9cdb" d="M14.72,86.2c-2.5-1.44-2.21-5.15.49-6.18l51.26-19.57c2.79-1.07,5.51,1.7,4.41,4.47l-20.25,51c-1.07,2.69-4.77,2.93-6.18.41l-10.25-18.34c-.3-.54-.74-.99-1.28-1.3l-18.2-10.49Z" />
                </g>
              </g>
            </g>
          </g>
        </svg>
        <div class="note">Для работы выделите текстовый блок в Figma, затем нажмите нужную кнопку.</div>
      </div>

      <button class="primary" id="apply-button">Применить переносы</button>
      <button class="reset" id="reset-button">Сбросить</button>
      <div class="author">by Eugeny Leshchenko</div>
      <div class="sr-only" id="status" aria-live="polite"></div>
    </main>

    <script>
      const applyButton = document.getElementById("apply-button");
      const resetButton = document.getElementById("reset-button");
      const statusNode = document.getElementById("status");

      function send(type) {
        parent.postMessage({ pluginMessage: { type } }, "*");
      }

      function setLoading(isLoading) {
        applyButton.disabled = isLoading;
        resetButton.disabled = isLoading;
      }

      function updateStatus(message, kind) {
        statusNode.textContent = message || "";
        statusNode.setAttribute("data-kind", kind || "");
      }

      applyButton.addEventListener("click", () => send("apply"));
      resetButton.addEventListener("click", () => send("reset"));

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message || typeof message !== "object") {
          return;
        }

        if (message.type === "loading") {
          setLoading(Boolean(message.isLoading));
        }

        if (message.type === "status") {
          updateStatus(message.message, message.kind);
        }
      };
    </script>
  </body>
</html>
